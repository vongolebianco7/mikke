name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify app when present
        run: |
          if [ -f package.json ]; then
            node --check src/app.js
            node --check src/domain/parseWatch.js
            node --check src/domain/evaluate.js
            npm test
          else
            echo "App scaffold not on this branch yet."
          fi
