name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/app.js
          node --check src/domain/parseWatch.js
          node --check src/domain/evaluate.js
      - name: Unit tests
        run: npm test
