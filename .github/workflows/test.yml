name: release-gates

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check src/app.js
          node --check src/domain/composerController.js
          node --check src/canonicalComposerUi.js
          node --check src/domain/parseWatch.js
          node --check src/domain/evaluate.js
          node --check src/domain/providerAttribution.js
          node --check src/domain/providerCredits.js
          node --check src/domain/outboundUrl.js
          node --check src/domain/pricing.js
          node --check src/domain/localData.js
          node --check src/connectors/officialShopping.js
          node --check src/connectors/runWatchCheck.js
          node --check src/server/requestGuard.js
          node --check src/server/shoppingProviders.js
          node --check src/server/operationalTelemetry.js
          node --check src/server/alertEvaluator.js
          node --check api/shopping-search.js
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Full system regression suite
        run: npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run security
      - run: npm run security:history

  compliance-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run compliance

  nonfunctional-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run nonfunctional

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run build
